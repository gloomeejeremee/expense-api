<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이재림 — 개인 소개</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0C;
    --paper:#F6F5F1;
    --amber:#F2871D;
    --graphite:#3A3A3C;
    --line:#D8D6D0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--graphite);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:6vw;
  }
  .card{
    max-width:640px;
    width:100%;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:14px;
  }
  h1{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:clamp(36px,7vw,56px);
    color:var(--ink);
    letter-spacing:-0.01em;
    margin-bottom:16px;
  }
  p.role{
    font-size:17px;
    color:var(--graphite);
    margin-bottom:24px;
    line-height:1.5;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:36px;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:1px solid var(--line);
    color:var(--graphite);
    padding:6px 12px;
    border-radius:999px;
  }
  .cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    padding:14px 22px;
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .cta:hover{background:var(--amber);color:var(--ink);}
  footer{
    margin-top:48px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8C8A80;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">클라우드컴퓨팅실습 · 3주차 과제</div>
    <h1>안녕하세요,<br>이재림입니다.</h1>
    <p class="role">
      Korea JoongAng Daily에서 반도체·기술·조선업을 취재하는 비즈니스 기자입니다.
      KAIST 정보경영 프로그램(IMMS)에서 데이터·AI 관련 역량을 함께 쌓고 있습니다.
    </p>
    <div class="tags">
      <span class="tag">Journalism</span>
      <span class="tag">Semiconductors</span>
      <span class="tag">KAIST IMMS</span>
    </div>
    <a class="cta" href="api-demo.html">연동 실습 페이지 보기 →</a>
    <footer>Cloud Computing Practice · Week 3 Assignment</footer>
  </div>
</body>
</html>
